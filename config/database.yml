default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres
  host: localhost

development:
  <<: *default
  database: emergency_platform_development

test:
  <<: *default
  database: emergency_platform_test

production:
  <<: *default
  database: emergency_platform_production
  password: <%= ENV["EMERGENCY_PLATFORM_DATABASE_PASSWORD"] %>